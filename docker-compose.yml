services:
  # 1. Database MySQL
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ecommerce_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  # 2. Backend API (Node.js + Express + Sequelize)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ecommerce_db
      DB_USER: root
      DB_PASSWORD: root123
      JWT_SECRET: nhom10_st23d_jwt_secret_key_2024
      JWT_EXPIRES_IN: 7d
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    restart: unless-stopped

  # 3. Frontend (React + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: ecommerce-frontend
    ports:
      - "3000:10000"
    environment:
      - PORT=10000
      - BACKEND_URL=http://backend:5000/api/
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data: