version: "3.8"

services:
  # 1. Cơ sở dữ liệu MySQL Production
  mysql:
    image: mysql:8.0
    container_name: prod-ecommerce-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ecommerce_db
    ports:
      - "3306:3306"
    volumes:
      - prod_mysql_data:/var/lib/mysql
    networks:
      - ecommerce-net

  # 2. Backend Service (Node.js + Express + Sequelize)
  backend:
    image: ${DOCKER_USER:-devvd25}/ecommerce-backend:latest
    container_name: prod-ecommerce-backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ecommerce_db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      JWT_SECRET: ${JWT_SECRET:-nhom10_st23d_jwt_secret_key_2024}
      JWT_EXPIRES_IN: 7d
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    networks:
      - ecommerce-net

  # 3. Frontend Service (React + Nginx)
  frontend:
    image: ${DOCKER_USER:-devvd25}/ecommerce-frontend:latest
    container_name: prod-ecommerce-frontend
    restart: always
    ports:
      - "3000:10000"
    environment:
      - PORT=10000
      - BACKEND_URL=http://backend:5000/api/
    depends_on:
      - backend
    networks:
      - ecommerce-net

volumes:
  prod_mysql_data:

networks:
  ecommerce-net:
    driver: bridge
